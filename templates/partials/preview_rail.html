{# Minimizable animated story rail — separate from inline product UI mocks #}
<aside class="ds-preview-rail" id="ds-preview-rail" data-ds-preview-rail="{{ section_id }}" aria-label="Story walkthrough preview">
  <div class="ds-preview-rail-head" id="ds-preview-rail-head">
    <span class="ds-preview-rail-badge">Story walkthrough</span>
    <div class="ds-preview-rail-labels" id="ds-preview-rail-labels">
      <span class="ds-preview-rail-title" id="ds-preview-rail-title">Preview</span>
      <span class="ds-preview-rail-sub" id="ds-preview-rail-sub"></span>
    </div>
    <span class="ds-preview-rail-counter" id="ds-preview-rail-counter" hidden aria-live="polite"></span>
    <button type="button" class="ds-preview-rail-minimize" id="ds-preview-rail-minimize" onclick="event.stopPropagation();dsTogglePreviewRail()" aria-label="Minimize story preview" aria-expanded="true" title="Minimize panel">
      <span class="ds-preview-rail-minimize-icon" aria-hidden="true">›</span>
    </button>
  </div>
  <div class="ds-preview-rail-inner" id="ds-preview-rail-inner">
    <div class="ds-preview-rail-dots" id="ds-preview-rail-dots" hidden aria-hidden="true"></div>
    <div class="ds-preview-rail-announcer visually-hidden" id="ds-preview-rail-announcer" aria-live="polite" aria-atomic="true"></div>
    <div class="ds-preview-rail-host" id="ds-preview-rail-host" aria-busy="true"></div>
    <div class="ds-preview-rail-foot" id="ds-preview-rail-foot">
      <button type="button" class="ds-preview-rail-foot-btn ds-preview-rail-foot-btn--ghost" id="ds-preview-rail-prev" onclick="dsPreviewRailStepPrev()" title="Previous step" aria-label="Previous step">←</button>
      <button type="button" class="ds-preview-rail-foot-btn ds-preview-rail-foot-btn--primary" id="ds-preview-rail-play" onclick="dsPreviewRailTogglePlay()" title="Play story" aria-label="Play story walkthrough">▶</button>
      <button type="button" class="ds-preview-rail-foot-btn ds-preview-rail-foot-btn--ghost" id="ds-preview-rail-next" onclick="dsPreviewRailStepNext()" title="Next step" aria-label="Next step">→</button>
      <button type="button" class="ds-preview-rail-foot-btn ds-preview-rail-foot-btn--ghost" id="ds-preview-rail-restart" onclick="dsPreviewRailRestart()" title="Restart story" aria-label="Restart story">↺</button>
    </div>
  </div>
</aside>
