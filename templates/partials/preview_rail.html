{# Minimizable animated product preview rail — companion to inline mocks #}
<aside class="ds-preview-rail" id="ds-preview-rail" data-ds-preview-rail="{{ section_id }}" aria-label="Animated product preview">
  <div class="ds-preview-rail-head" id="ds-preview-rail-head">
    <span class="ds-preview-rail-badge">Live preview</span>
    <div class="ds-preview-rail-labels" id="ds-preview-rail-labels">
      <span class="ds-preview-rail-title" id="ds-preview-rail-title">Preview</span>
      <span class="ds-preview-rail-sub" id="ds-preview-rail-sub"></span>
    </div>
    <button type="button" class="ds-preview-rail-minimize" id="ds-preview-rail-minimize" onclick="event.stopPropagation();dsTogglePreviewRail()" aria-label="Minimize product preview" aria-expanded="true" title="Minimize panel">
      <span class="ds-preview-rail-minimize-icon" aria-hidden="true">›</span>
    </button>
  </div>
  <div class="ds-preview-rail-inner" id="ds-preview-rail-inner">
    <div class="ds-preview-rail-tabs" id="ds-preview-rail-tabs" hidden></div>
    <div class="ds-preview-rail-host" id="ds-preview-rail-host" aria-busy="true"></div>
    <div class="ds-preview-rail-foot" id="ds-preview-rail-foot">
      <button type="button" class="ds-preview-rail-foot-btn" id="ds-preview-rail-prev" onclick="dsPreviewRailStepPrev()" title="Previous step" aria-label="Previous step">←</button>
      <button type="button" class="ds-preview-rail-foot-btn ds-preview-rail-foot-btn--play" id="ds-preview-rail-play" onclick="dsPreviewRailTogglePlay()" title="Play walkthrough" aria-label="Play walkthrough">▶</button>
      <button type="button" class="ds-preview-rail-foot-btn" id="ds-preview-rail-next" onclick="dsPreviewRailStepNext()" title="Next step" aria-label="Next step">→</button>
      <button type="button" class="ds-preview-rail-foot-btn ds-preview-rail-foot-btn--restart" id="ds-preview-rail-restart" onclick="dsPreviewRailRestart()" title="Restart walkthrough" aria-label="Restart walkthrough">↺</button>
    </div>
  </div>
</aside>
