{% import "partials/icons.html" as icons %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in — Docusign IAM Demo</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" />
  {% include "partials/fonts.html" %}
  <link rel="stylesheet" href="{{ asset('css/core/app.css') }}" />
  <link rel="stylesheet" href="{{ asset('css/pages/site-login.css') }}" />
  <script src="{{ asset('js/core/boot-theme.js') }}"></script>
</head>
<body class="site-login-body">
  <main class="site-login">
    <div class="site-login-card">
      <div class="site-login-brand">
        <span class="site-login-mark">{{ icons.logo_mark() }}</span>
        <div>
          <div class="site-login-kicker">Docusign IAM</div>
          <div class="site-login-title">Public sector demo</div>
        </div>
      </div>
      <p class="site-login-sub">Enter the demo password to continue.</p>

      {% if error %}
      <div class="site-login-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('site.login') }}" class="site-login-form" autocomplete="current-password">
        <input type="hidden" name="next" value="{{ next_url }}" />
        <label class="site-login-label" for="site-password">Password</label>
        <input
          id="site-password"
          class="site-login-input"
          type="password"
          name="password"
          required
          autofocus
          placeholder="Demo password"
        />
        <button type="submit" class="btn btn-primary site-login-submit">Continue</button>
      </form>
    </div>
  </main>
</body>
</html>
